# ~/.config/rizzoo/config.toml
# See `rizzoo --help` for all available flags and values.
#
# Uncomment and edit only what you want to override.

#style = "tonal-spot"
#mode = dark
#contrast = "standard"
pick = 0
#prefer = "darkness"
 
#[wallpaper]
#set = false
#command = "awww img {{ image }} --transition-type random"

[custom_colors]
success    = { color = "#386B35", blend = true }

[btop]
template = "btop.theme"
output   = "~/.config/btop/themes/dynamic.theme"

enabled = false
[antigravity]
template = "antigravity.json"
output   = "~/.config/Antigravity/User/settings.json"

enabled = false
[zed]
template = "colors-zed.conf"
output   = "~/.config/zed/themes/dynamic.json"

enabled = false
[alacritty]
template = "colors-alacritty.toml"
output   = "~/.config/alacritty/colors/variants/dynamic.toml"
#enabled  = false

enabled = false
[ghostty]
template = "colors-ghostty.conf"
output   = "~/.config/ghostty/colors/variants/dynamic.ghostty" 

enabled = false
[kitty]
template = "colors-kitty.conf"
output   = "~/.config/kitty/colors/variants/dynamic.conf" 

enabled = false
[micro]
template = "colors-micro.micro"
output   = "~/.config/micro/colorschemes/dynamic.micro"

enabled = false
[nvim]
template = "colors-nvim.lua"
output   = "~/.config/nvim/lua/rizzoo/palette.lua"
post_hook = "pkill -USR1 nvim || true"

enabled = false
[sway]
template = "colors-sway"
output   = "~/.config/sway/colors/variants/dynamic.conf" 

enabled = false
[niri]
template = "colors-niri-layout.kdl"
output   = "~/.config/niri/kdl/layout.kdl"
enabled = false

[Xresources]
template = "colors.Xresources"
output   = "~/xresources/variants/dynamic"

enabled = false
[peaclock]
template = "colors-peaclock.conf"
output   = "~/.peaclock/variants/dynamic.conf"
enabled = false

[starship]
template = "colors-starship-tyn.toml"
output   = "~/.config/starship.toml"
enabled = false

[foot]
template = "colors-foot.ini"
output   = "~/.config/foot/color-foot.ini"
enabled = false

[cava]
template = "colors-cava.ini"
output   = "~/.config/cava/config"
enabled = false

[pywalfox]
template = "colors-firefox.json"
output   = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"

enabled = false
[noctalia]
template = "colors-noctalia.json"
output   = "~/.config/noctalia/palettes/rizzoo.json"

enabled = false
[anki-cards]
template = "mcq-anki.css"
output   = "~/projects/anki-mcq-builder/static/_theme.css"

# GTK3 / GTK4(libadwaita) Themes
# note: only a single gtk theme must have an active post_hook

#[colloid]
#template = "colloid-colors.scss"
#output   = "~/dotfiles-pub/gtk/colloid/Colloid-gtk-theme/src/sass/_colors.scss"
#post_hook = "~/dotfiles-pub/gtk/colloid/reload.sh"


#[graphite]
#template = "graphite-colors.scss"
#output   = "~/dotfiles-pub/gtk/graphite/Graphite-gtk-theme/src/sass/_colors.scss"
#post_hook = "~/dotfiles-pub/gtk/graphite/reload.sh"

enabled = false
[mac-colors]
template = "mac-colors.scss"
output   = "~/dotfiles-pub/gtk/mac-tahoe/MacTahoe-gtk-theme/src/sass/_colors.scss"
post_hook = "~/dotfiles-pub/gtk/mac-tahoe/reload.sh"
enabled = false

# QT Themes
# Qt5 + Qt6 palette via qt5ct/qt6ct

[qt5ct]
template = "colors-qtct.conf"
output   = "~/.config/qt5ct/colors/dynamic.conf"
enabled = false

[qt6ct]
template = "colors-qtct.conf"
output   = "~/.config/qt6ct/colors/dynamic.conf"
enabled = false

[kvantum]
template = "colors-kvantum.svg"
output   = "~/.config/Kvantum/KvMaterial/KvMaterial.svg"
enabled = false

[kvantum-kvconfig]
template = "colors-kvantum.kvconfig"
output   = "~/.config/Kvantum/KvMaterial/KvMaterial.kvconfig"
enabled = false


