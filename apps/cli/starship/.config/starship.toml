"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#86a6c4)\
$os\
$username\
[](bg:#97a4b2 fg:#86a6c4)\
$directory\
[](fg:#97a4b2 bg:#ab9dbc)\
$git_branch\
$git_status\
[](fg:#ab9dbc bg:#cce5ff)\
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#cce5ff bg:#d6e4f3)\
$docker_context\
[](fg:#d6e4f3 bg:#ecdcfe)\
$time\
[ ](fg:#ecdcfe)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#86a6c4 fg:#00192b"
style_root = "bg:#86a6c4 fg:#00192b"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#86a6c4 fg:#00192b"
disabled = true # Disabled by default

[directory]
style = "bg:#97a4b2 fg:#0c1923"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#d6e4f3 fg:#596673"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#ab9dbc fg:#1c132b"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#ab9dbc fg:#1c132b"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[gradle]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[maven]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#cce5ff fg:#486882"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#ecdcfe fg:#6b5f7b"
format = '[ ♥ $time ]($style)'
