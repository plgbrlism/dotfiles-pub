"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#cf9677)\
$username\
[](bg:#bc9c8c fg:#cf9677)\
$directory\
[](fg:#bc9c8c bg:#3c332f)\
$git_branch\
$git_status\
[](fg:#3c332f bg:#261e1a)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#261e1a bg:#130d09)\
$time\
[ ](fg:#130d09)\
\n$character"""

[directory]
style = "fg:#251309 bg:#bc9c8c"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#3c332f"
format = '[[ $symbol $branch ](fg:#cf9677 bg:#3c332f)]($style)'

[git_status]
style = "bg:#3c332f"
format = '[[($all_status$ahead_behind )](fg:#a9a479 bg:#3c332f)]($style)'

[nodejs]
symbol = ""
style = "bg:#261e1a"
format = '[[ $symbol ($version) ](fg:#f7b998 bg:#261e1a)]($style)'

[bun]
symbol = ""
style = "bg:#261e1a"
format = '[[ $symbol ($version) ](fg:#f7b998 bg:#261e1a)]($style)'

[rust]
symbol = ""
style = "bg:#261e1a"
format = '[[ $symbol ($version) ](fg:#cdc89a bg:#261e1a)]($style)'

[golang]
symbol = ""
style = "bg:#261e1a"
format = '[[ $symbol ($version) ](fg:#f7b998 bg:#261e1a)]($style)'

[php]
symbol = ""
style = "bg:#261e1a"
format = '[[ $symbol ($version) ](fg:#e2bfae bg:#261e1a)]($style)'

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "bg:#130d09"
format = '[[  $time ](fg:#9e8d86 bg:#130d09)]($style)'

[character]
success_symbol = "[❯](bold #cf9677)"
error_symbol = "[❯](bold #ff7b6e)"

[os]
style = "bg:#cf9677 fg:#2d0f00"
format = "[ $symbol ]($style)"
disabled = true

[username]
show_always = true
style_user = "bg:#cf9677 fg:#2d0f00"
style_root = "bg:#cf9677 fg:#390001"
format = "[ $user ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
