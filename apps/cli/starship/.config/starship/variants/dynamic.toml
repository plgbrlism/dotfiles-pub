"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#a79dc8)\
$username\
[](bg:#a6a0b4 fg:#a79dc8)\
$directory\
[](fg:#a6a0b4 bg:#363439)\
$git_branch\
$git_status\
[](fg:#363439 bg:#201f23)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#201f23 bg:#0f0e12)\
$time\
[ ](fg:#0f0e12)\
\n$character"""

[directory]
style = "fg:#191525 bg:#a6a0b4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#363439"
format = '[[ $symbol $branch ](fg:#a79dc8 bg:#363439)]($style)'

[git_status]
style = "bg:#363439"
format = '[[($all_status$ahead_behind )](fg:#c297a6 bg:#363439)]($style)'

[nodejs]
symbol = ""
style = "bg:#201f23"
format = '[[ $symbol ($version) ](fg:#cbc0ed bg:#201f23)]($style)'

[bun]
symbol = ""
style = "bg:#201f23"
format = '[[ $symbol ($version) ](fg:#cbc0ed bg:#201f23)]($style)'

[rust]
symbol = ""
style = "bg:#201f23"
format = '[[ $symbol ($version) ](fg:#e8bbc9 bg:#201f23)]($style)'

[golang]
symbol = ""
style = "bg:#201f23"
format = '[[ $symbol ($version) ](fg:#cbc0ed bg:#201f23)]($style)'

[php]
symbol = ""
style = "bg:#201f23"
format = '[[ $symbol ($version) ](fg:#cac3d9 bg:#201f23)]($style)'

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "bg:#0f0e12"
format = '[[  $time ](fg:#938f98 bg:#0f0e12)]($style)'

[character]
success_symbol = "[❯](bold #a79dc8)"
error_symbol = "[❯](bold #ff7b6e)"

[os]
style = "bg:#a79dc8 fg:#191234"
format = "[ $symbol ]($style)"
disabled = true

[username]
show_always = true
style_user = "bg:#a79dc8 fg:#191234"
style_root = "bg:#a79dc8 fg:#390001"
format = "[ $user ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
