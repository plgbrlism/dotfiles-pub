; --- Base ---
include-file = colors/colors.ini

; --- Bar geometry (swap: flat / floating / notch / minimal) ---
include-file = bar/flat.ini
include-file = fonts/fonts.ini

[bar/main]
modules-left   = powermenu xworkspaces xwindow 
modules-center = 
modules-right  = systray sep pulseaudio backlight sep wlan sep battery

; --- Modules (comment/uncomment to swap) ---
include-file = modules/sep.ini
include-file = modules/systray.ini
include-file = modules/network-base.ini
include-file = modules/xworkspaces-icons.ini
include-file = modules/xwindow-icons.ini
include-file = modules/memory.ini
include-file = modules/cpu.ini
include-file = modules/pulseaudio-icons.ini
include-file = modules/backlight.ini
include-file = modules/brightness-icons.ini
include-file = modules/wlan-icons.ini
include-file = modules/battery-icons.ini
include-file = modules/powermenu.ini
