[bar/main]
width = 100%
height = 18pt

background = ${colors.background}
foreground = ${colors.foreground}

padding-right = 3
padding-left = 3
module-margin = 1

border-top-size = 5
border-bottom-size = 0
border-left-size = 10
border-right-size = 10

radius = 8

cursor-click = pointer
cursor-scroll = ns-resize
reverse-scroll = true

enable-ipc = true
enable-click = true
