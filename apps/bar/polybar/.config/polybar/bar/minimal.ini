[bar/main]
width = 100%
height = 18pt

background = ${colors.background}
foreground = ${colors.foreground}

padding-right = 3
module-margin = 1

border-top-size = 0
border-bottom-size = 0
border-left-size = 368
border-right-size = 368

radius-bottom-left = 12
radius-bottom-right = 12

cursor-click = pointer
cursor-scroll = ns-resize
reverse-scroll = true

enable-ipc = true
enable-click = true
