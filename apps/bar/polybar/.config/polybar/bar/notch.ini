[bar/main]
width = 100%
height = 18pt

background = ${colors.background}
foreground = ${colors.foreground}

padding-right = 3
module-margin = 1

border-top-size = 0
border-bottom-size = 0
border-left-size = 100
border-right-size = 100

radius-top-left = 0
radius-top-right = 0
radius-bottom-left = 15
radius-bottom-right = 15

cursor-click = pointer
cursor-scroll = ns-resize
reverse-scroll = true

enable-ipc = true
enable-click = true
