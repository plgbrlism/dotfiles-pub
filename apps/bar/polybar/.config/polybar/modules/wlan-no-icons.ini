[module/wlan]
inherit = network-base
interface-type = wireless

label-connected = "%{A1:sh -c '~/.config/rofi/scripts/wifi/rofi-wifi.sh':}WI-FI %essid%%{A}"
label-connected-foreground = ${colors.foreground}

label-disconnected = "%{A1:sh -c '~/.config/rofi/scripts/wifi/rofi-wifi.sh':}no Internet %{A}"
label-disconnected-foreground = ${colors.warning}
