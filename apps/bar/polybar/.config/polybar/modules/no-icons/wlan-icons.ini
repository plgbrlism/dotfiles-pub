[module/wlan]
inherit = network-base
interface-type = wireless

label-connected = "%{A1:~/.config/rofi/scripts/wifi/rofi-wifi.sh:}WIF %essid%%{A}"
label-connected-foreground = ${colors.secondary}

label-disconnected = "%{A1:~/.config/rofi/scripts/wifi/rofi-wifi.sh:}WIF  offline%{A}"
label-disconnected-foreground = ${colors.error}
