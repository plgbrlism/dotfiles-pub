[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
full-at = 90

label-charging = "CHA %percentage%%"
format-charging = <label-charging>
label-charging-foreground = ${colors.success}

label-discharging = "BAT %percentage%%"
format-discharging = <label-discharging>
label-discharging-foreground = ${colors.secondary}
ramp-capacity-foreground = ${colors.secondary}

label-full = "FUL %percentage%%"
format-full = <label-full>

label-low = "LOW %percentage%%"
format-low = <label-low>
label-low-foreground = ${colors.error}
