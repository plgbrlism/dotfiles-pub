# ╭──────────────────────────────╮
# │           Autostart          │
# ╰──────────────────────────────╯

exec_always --no-startup-id $bar
exec_always --no-startup-id $compositor
exec --no-startup-id /usr/libexec/polkit-mate-authentication-agent-1
exec --no-startup-id dunst
exec --no-startup-id /usr/libexec/xdg-desktop-portal-gtk
exec --no-startup-id /usr/libexec/xdg-desktop-portal
exec --no-startup-id sudo /usr/sbin/powertop --auto-tune

# ╭──────────────────────────────╮
# │   Wallpaper & Colors Reload  │
# ╰──────────────────────────────╯

exec --no-startup-id ~/.config/rofi/scripts/wallpaper/cache-wallpaper.sh --restore
