# ───────────────────────────────
# SwayFX Settings
# ───────────────────────────────

# Disable blur completely
blur disable
blur_xray disable
blur_passes 0
blur_radius 0

# Keep rounded corners
corner_radius 12

# Shadows
shadows enable
shadow_blur_radius 20
shadow_color #00000040
shadow_offset 0 4
shadow_inactive_color #00000020

# Dim unfocused windows
default_dim_inactive 0.1
