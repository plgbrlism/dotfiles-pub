# ~~ swayfx ~~

# Disable blur completely
#blur enable
#blur_xray enable
#blur_passes 2
#blur_radius 1

# Keep rounded corners
corner_radius 12

# Shadows
shadows enable
shadow_blur_radius 20
shadow_color #00000040
shadow_offset 0 4
shadow_inactive_color #00000020

# Dim unfocused windows
default_dim_inactive 0.2

# animation
animation_duration_ms 170

