# ~~ Password Input Field ~~
input-field {
    size = 100, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.8
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    font_family = $font-0
    placeholder_text = <span foreground="##ffffff99"></span>
    hide_input = false
    position = 0, -153
    halign = center
    valign = center
}
